[build]
builder = "NIXPACKS"
buildCommand = "cd backend && npm install && cd ../admin-panel && npm install && npm run build && cd ../advertiser-panel && npm install && npm run build"

[deploy]
startCommand = "cd backend && NODE_ENV=production node src/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

